# Three targets, same models:
#   local - DuckDB file over the Parquet in data/parquet (no cloud; used for development and tests)
#   dev   - BigQuery, datasets staging/marts (the real warehouse)
#   ci    - BigQuery, everything in the `ci` dataset (tables auto-expire after 3 days)
transitpulse:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('TP_DUCKDB_PATH', 'data/transitpulse.duckdb') }}"
      schema: main
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"

    dev:
      type: bigquery
      method: "{{ 'service-account' if env_var('GOOGLE_APPLICATION_CREDENTIALS', '') else 'oauth' }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      project: "{{ env_var('TP_GCP_PROJECT', 'unset') }}"
      dataset: staging
      location: us-west1
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      # per-query cap (TRANSITPULSE_PLAN §8). A full rebuild reads ~3-6 GB of raw.bart_od (2018-2025);
      # incremental runs read a few hundred MB. Free tier: 1 TB/month.
      maximum_bytes_billed: 20000000000
      job_execution_timeout_seconds: 300

    ci:
      type: bigquery
      method: oauth # GitHub Actions authenticates through Workload Identity Federation
      project: "{{ env_var('TP_GCP_PROJECT', 'unset') }}"
      dataset: ci
      location: us-west1
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      maximum_bytes_billed: 500000000
