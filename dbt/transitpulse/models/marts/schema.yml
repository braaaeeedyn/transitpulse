version: 2

models:
  - name: mart_recovery
    description: >
      Station-level weekday recovery vs the same ISO week of ISO year 2019 (2018-12-31 .. 2019-12-29). Days in ISO
      year 2019 are the baseline and are not output rows.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [trip_date, station_code]
    columns:
      - name: recovery_ratio
        data_tests: [non_negative]

  - name: mart_peak_load
    description: Peak hour and peak-hour share per station (last 90 days of service weekdays).
    columns:
      - name: station_code
        data_tests: [not_null, unique]
      - name: peak_hour_share
        data_tests: [not_null, non_negative]

  - name: mart_od_flows
    description: Monthly origin-destination trips with MoM / YoY change and rank from origin.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [month_start, origin_code, destination_code]

  - name: mart_kpis_daily
    description: One row per day with every KPI in docs/METRICS.md.
    columns:
      - name: trip_date
        data_tests: [not_null, unique]
      - name: total_entries
        data_tests: [not_null, non_negative]
      - name: rolling_28d_avg_entries
        description: Mean daily entries over the calendar days present in [trip_date - 27, trip_date].
        data_tests: [not_null, non_negative]
      - name: rolling_28d_days
        description: How many days of [trip_date - 27, trip_date] are loaded (28 when there is no gap).
        data_tests: [not_null, non_negative]

  - name: mart_ridership_monthly
    description: Monthly averages of mart_kpis_daily (daily entries, service-weekday recovery and peak-hour share).
    columns:
      - name: month_start
        data_tests: [not_null, unique]
      - name: days
        data_tests: [not_null, non_negative]
      - name: avg_daily_entries
        data_tests: [not_null, non_negative]
      - name: avg_service_weekday_recovery
        data_tests: [non_negative]

  - name: mart_bikes_vs_trains
    description: >
      Monthly BART entries and Bay Wheels trips, average per day, and each as an index vs the same month of 2019
      (= 100). Full outer join, so a month with only one of the two sources still appears.
    columns:
      - name: month_start
        data_tests: [not_null, unique]
      - name: bart_entries
        data_tests: [non_negative]
      - name: bike_trips
        data_tests: [non_negative]
