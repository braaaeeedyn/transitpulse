# Pull-request checks (IMPLEMENTATION_PLAN M0/M7). Deploying is deploy.yml (off until DEPLOY_ENABLED is set).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dbt --group ml --group pipeline --group agent
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # before pytest: the Dagster definitions test loads dbt's target/manifest.json
      - name: dbt parse (models compile; no warehouse needed)
        run: uv run --group dbt dbt parse --project-dir dbt/transitpulse --profiles-dir dbt/transitpulse
        env:
          DBT_TARGET: local
      - name: Unit tests (incl. dbt build on a generated fixture, forecast, Bay Wheels cleaning)
        run: uv run --group dbt --group ml --group pipeline --group agent pytest -m "not spark and not gcp and not localdata and not docker"
      - name: Shellcheck (Oracle VM bootstrap)
        run: shellcheck deploy/oracle/bootstrap.sh

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group spark
      - run: uv run pytest -m spark tests/spark

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Schedule maths (node:test)
        run: node --test tests/web/
      - name: Browser tests (Playwright)
        run: npx playwright test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the Cloud Run image (same Dockerfile deploy.yml pushes)
        run: docker build -t transitpulse-api:ci .
      - name: Image size (Artifact Registry free tier is 0.5 GB for 3 kept images)
        run: docker image inspect -f '{{.Size}}' transitpulse-api:ci
      - name: Container smoke tests (non-root, site + health, 503 without a warehouse, agent with the fake LLM)
        run: uv run pytest -m docker tests/deploy
        env:
          TP_TEST_IMAGE: transitpulse-api:ci

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
